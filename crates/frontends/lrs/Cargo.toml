[package]
name = "lrs"
description = "The terminal frontend for the runtime."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "lrs"
path = "src/lib.rs"

[[bin]]
name = "lrs"
path = "src/main.rs"

[features]
default = ["local-runtime", "legacy-http"]
# Temporary bridge to the Python `lele serve`, used until `runtime`
# exposes the same ports in-process. This is NOT the primary path.
legacy-http = ["dep:ureq"]
# Primary path: embed `runtime` directly in the frontend process.
local-runtime = ["dep:runtime", "dep:gateway", "dep:runner-react", "dep:tool-executor-native", "dep:tool-executor-ptc", "dep:tool-permission", "dep:tools", "dep:system-prompt", "dep:agent-tool-presentation", "dep:session"]

[dependencies]
protocol = { workspace = true }
sdk = { workspace = true }
runtime = { workspace = true, optional = true }
gateway = { workspace = true, optional = true }
runner-react = { workspace = true, optional = true }
tool-executor-native = { workspace = true, optional = true }
tool-executor-ptc = { workspace = true, optional = true }
tool-permission = { workspace = true, optional = true }
tools = { workspace = true, optional = true }
system-prompt = { workspace = true, optional = true }
agent-tool-presentation = { workspace = true, optional = true }
tool-shell = { workspace = true }
session = { workspace = true, optional = true }

anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

arboard = "3.6.1"
base64 = "0.22.1"
crossterm = "0.29.0"
dirs = "6.0.0"
png = "0.18.0"
ratatui = "0.30.2"
ureq = { version = "3.3.0", default-features = false, features = ["json"], optional = true }
